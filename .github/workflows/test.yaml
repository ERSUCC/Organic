name: Run Tests

on: [ push, pull_request ]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ~4.4.2

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev libpipewire-0.3-dev libsndfile1-dev libsamplerate0-dev

      - name: Build RtAudio
        run: |
          git clone https://github.com/ERSUCC/rtaudio
          cd rtaudio
          git checkout --force ee572da
          cmake -B build
          cd build
          sudo make install
          sudo ldconfig /usr/local/lib

      - name: Build
        run: |
          cmake -B build -DORGANIC_BUILD_TESTS=1
          cmake --build build --config Release

      - name: Test
        run: ./build/organic_test
