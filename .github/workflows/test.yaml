name: Run Tests

on: [ push, pull_request ]

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ~4.4.2

      - name: Install ALSA
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev

      - name: Build
        run: |
          cmake -B build -DORGANIC_VERSION=0.1.0
          cmake --build build --config Release

      - name: Test
        run: ./build/organic_test
